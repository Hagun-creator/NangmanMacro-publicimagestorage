name: 한국판 이미지 제출
description: 낭만강호 한국판 스크린샷을 제출합니다.
title: "[이미지 제출] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        낭만강호 한국판 이미지 수집에 참여해주셔서 감사합니다.
        가능하면 **전체 스크린샷 원본**을 첨부해주세요. 필요한 부분은 검수 단계에서 다시 크롭합니다.

  - type: dropdown
    id: category
    attributes:
      label: 작업 분류
      options:
        - Map / 지도명
        - MapExt / 확장 지도명
        - MapClone / 던전 지도명
        - XY / 현재 좌표
        - TwoHour / 시진
        - GuildName / 문파
        - Jump / 경공
        - InfoButton / HUD 아이콘
        - SpecIcon / 상태 아이콘
        - DialogButton / 대화 버튼
        - DialogButtonSystem / 시스템 설정
        - 기타 UI
    validations:
      required: true

  - type: input
    id: korean_name
    attributes:
      label: 화면에 보이는 한국어 이름
      placeholder: 예) 낙양, 소림사, 답월유향, 유

  - type: input
    id: resolution
    attributes:
      label: 원본 화면 해상도
      placeholder: 예) 1012x560

  - type: textarea
    id: screenshot
    attributes:
      label: 원본 스크린샷 첨부
      description: 이 칸에 이미지 파일을 드래그하거나 붙여넣어 주세요. 가능하면 잘라내지 않은 전체 화면을 올려주세요.
      placeholder: 여기에 이미지 파일을 드래그하세요.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 설명 / 메모
      description: 어떤 상태의 화면인지, 활성/후보 여부, 문파 없음 등 특이사항을 적어주세요.

  - type: checkboxes
    id: consent
    attributes:
      label: 공개 저장 동의
      options:
        - label: 이 이미지를 공개 저장소의 분석·크롭·한국판 템플릿 제작에 사용하는 것에 동의합니다.
          required: true
