name: Deploy image browser

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "scripts/**"
      - "shute6_site_data_v1.zip"
      - ".github/workflows/pages.yml"
  issues:
    types: [labeled, unlabeled, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Expand Shute6 image data
        run: |
          if [ ! -f shute6_site_data_v1.zip ]; then
            echo "Missing shute6_site_data_v1.zip"
            exit 1
          fi
          unzip -o shute6_site_data_v1.zip
      - name: Build 1037-template PNG browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
